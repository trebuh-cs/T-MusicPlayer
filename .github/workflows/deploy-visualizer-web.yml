name: Deploy iPad Visualizer Web App (GitHub Pages)

on:
  push:
    branches: [ main, master ]
    paths:
      - "apps/visualizer-web/**"
      - "shared/visualizer/**"
      - "shared/themes/**"
      - ".github/workflows/deploy-visualizer-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-visualizer-web"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: apps/visualizer-web
        run: npm ci
      - name: Build PWA for GitHub Pages
        working-directory: apps/visualizer-web
        env:
          VITE_BASE_PATH: "/${{ github.event.repository.name }}/"
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/visualizer-web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
