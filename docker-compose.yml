services:
  t-music-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: t-music-server
    restart: unless-stopped
    ports:
      - "8484:8484"
    env_file:
      - ./server/.env
    environment:
      - PORT=8484
      - DATA_DIR=/app/data
      - MUSIC_DIR=/app/music
      - DOWNLOADS_DIR=/app/downloads
    volumes:
      - ./server-data:/app/data
      - ./server-music:/app/music
      - ./server-downloads:/app/downloads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8484/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
